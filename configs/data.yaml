simulation:
  random_seed: 42
  num_products: 5
  num_locations: 4
  customer_groups: ["standard", "premium", "budget", "enterprise"]
  start_date: "2023-01-01"
  end_date: "2023-12-31"
  n_days: 365
  random_policy_ratio: 0.15 # 15% random price exploration days

confounding:
  unobserved_confounder_strength: 0.35
  demand_shifter_correlation: 0.65

storage:
  raw_data_path: "data/raw/transactions.parquet"
  processed_data_path: "data/processed/pricing_dataset.parquet"
  db_table_name: "sales_transactions"

splits:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  split_type: "time_based" # Leakage-safe chronological split

features:
  categorical:
    - "product_id"
    - "location_id"
    - "customer_group"
  numerical:
    - "price"
    - "cost"
    - "competitor_price"
    - "capacity"
  contextual:
    - "holiday"
    - "event"
    - "weather_temp"
    - "day_of_week"
    - "month"
  engineered:
    - "price_ratio_competitor"
    - "rolling_demand_7d"
    - "rolling_demand_14d"
    - "price_lag_1"
    - "log_price"
